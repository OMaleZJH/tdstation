services:
  - type: web
    name: tdstation
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_URL
        value: https://tdstation.onrender.com
      - key: CALLBACK_URL
        value: https://tdstation.onrender.com/api/auth/callback
      - key: TOKENDANCE_API_KEY
        sync: false
